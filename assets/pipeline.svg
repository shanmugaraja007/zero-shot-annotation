<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" width="1120" height="320" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1120" height="320" fill="#0d0f12"/>

  <text x="24" y="34" fill="#f0f0f2" font-size="17" font-weight="600">Zero shot annotation pipeline</text>
  <text x="24" y="56" fill="#75757e" font-size="13">Schematic. Not a model output.</text>

  <!-- 1 image -->
  <rect x="24" y="86" width="176" height="132" rx="8" fill="#141a1d" stroke="#2a3236"/>
  <rect x="40" y="150" width="144" height="52" fill="#1f2a24"/>
  <rect x="40" y="102" width="144" height="48" fill="#16202a"/>
  <circle cx="66" cy="122" r="10" fill="#243444"/>
  <rect x="104" y="160" width="34" height="26" rx="3" fill="#2b3a30"/>
  <text x="112" y="240" fill="#a9a9b2" font-size="13" font-weight="600">Image</text>
  <text x="112" y="258" fill="#75757e" font-size="11.5" text-anchor="middle">unlabelled frame</text>

  <!-- arrow -->
  <path d="M208 152 H244" stroke="#4f9f78" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 2 SAM2 -->
  <rect x="252" y="86" width="176" height="132" rx="8" fill="#141a1d" stroke="#2a3236"/>
  <path d="M268 176 C288 146 316 142 336 168 L344 180 Z" fill="#7dd3a0" opacity=".3" stroke="#7dd3a0" stroke-width="1.2"/>
  <rect x="352" y="120" width="56" height="44" rx="4" fill="#7dd3a0" opacity=".18" stroke="#7dd3a0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="296" cy="118" r="18" fill="#7dd3a0" opacity=".16" stroke="#7dd3a0" stroke-width="1.2"/>
  <rect x="268" y="190" width="140" height="18" rx="3" fill="#7dd3a0" opacity=".12" stroke="#7dd3a0" stroke-width="1"/>
  <text x="340" y="240" fill="#a9a9b2" font-size="13" font-weight="600" text-anchor="middle">SAM2</text>
  <text x="340" y="258" fill="#75757e" font-size="11.5" text-anchor="middle">class agnostic masks</text>
  <text x="340" y="276" fill="#75757e" font-size="11.5" text-anchor="middle">where, not what</text>

  <path d="M436 152 H472" stroke="#4f9f78" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 3 CLIP -->
  <rect x="480" y="86" width="176" height="132" rx="8" fill="#141a1d" stroke="#2a3236"/>
  <text x="496" y="112" fill="#6ba8e0" font-size="11" font-family="ui-monospace, Menlo, monospace">"a photo of a {}"</text>
  <rect x="496" y="122" width="60" height="15" rx="7.5" fill="#1c2b3a" stroke="#6ba8e0" stroke-width=".8"/>
  <text x="504" y="133" fill="#6ba8e0" font-size="10">tree</text>
  <rect x="562" y="122" width="72" height="15" rx="7.5" fill="#1c2b3a" stroke="#6ba8e0" stroke-width=".8"/>
  <text x="570" y="133" fill="#6ba8e0" font-size="10">crop field</text>
  <rect x="496" y="143" width="66" height="15" rx="7.5" fill="#1c2b3a" stroke="#6ba8e0" stroke-width=".8"/>
  <text x="504" y="154" fill="#6ba8e0" font-size="10">tractor</text>
  <path d="M496 174 H640" stroke="#2a3236" stroke-width="1"/>
  <text x="496" y="194" fill="#75757e" font-size="11">crop embed &#183; text embed</text>
  <text x="496" y="210" fill="#7dd3a0" font-size="11" font-family="ui-monospace, Menlo, monospace">cos sim &#8594; softmax</text>
  <text x="568" y="240" fill="#a9a9b2" font-size="13" font-weight="600" text-anchor="middle">CLIP</text>
  <text x="568" y="258" fill="#75757e" font-size="11.5" text-anchor="middle">what, from text alone</text>
  <text x="568" y="276" fill="#75757e" font-size="11.5" text-anchor="middle">no retraining</text>

  <path d="M664 152 H700" stroke="#4f9f78" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 4 filter -->
  <rect x="708" y="86" width="176" height="132" rx="8" fill="#141a1d" stroke="#2a3236"/>
  <text x="724" y="114" fill="#a9a9b2" font-size="11.5">confidence floor</text>
  <rect x="724" y="122" width="144" height="8" rx="4" fill="#22282c"/>
  <rect x="724" y="122" width="94" height="8" rx="4" fill="#7dd3a0" opacity=".55"/>
  <text x="724" y="150" fill="#75757e" font-size="11">below &#8594; unlabelled</text>
  <text x="724" y="176" fill="#a9a9b2" font-size="11.5">mask NMS</text>
  <rect x="724" y="184" width="52" height="24" rx="3" fill="#7dd3a0" opacity=".22" stroke="#7dd3a0" stroke-width="1"/>
  <rect x="748" y="192" width="40" height="16" rx="3" fill="#e0736b" opacity=".22" stroke="#e0736b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="796" y="205" fill="#75757e" font-size="11">drop overlap</text>
  <text x="796" y="240" fill="#a9a9b2" font-size="13" font-weight="600" text-anchor="middle">Filter</text>
  <text x="796" y="258" fill="#75757e" font-size="11.5" text-anchor="middle">silence beats a</text>
  <text x="796" y="276" fill="#75757e" font-size="11.5" text-anchor="middle">confident wrong label</text>

  <path d="M892 152 H928" stroke="#4f9f78" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 5 export -->
  <rect x="936" y="86" width="160" height="132" rx="8" fill="#141a1d" stroke="#2a3236"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11">
    <rect x="952" y="102" width="128" height="22" rx="4" fill="#18211c" stroke="#4f9f78" stroke-width=".9"/>
    <text x="962" y="117" fill="#7dd3a0">COCO json</text>
    <rect x="952" y="130" width="128" height="22" rx="4" fill="#18211c" stroke="#4f9f78" stroke-width=".9"/>
    <text x="962" y="145" fill="#7dd3a0">index masks</text>
    <rect x="952" y="158" width="128" height="22" rx="4" fill="#18211c" stroke="#4f9f78" stroke-width=".9"/>
    <text x="962" y="173" fill="#7dd3a0">per image json</text>
    <rect x="952" y="186" width="128" height="22" rx="4" fill="#18211c" stroke="#4f9f78" stroke-width=".9"/>
    <text x="962" y="201" fill="#7dd3a0">overlay jpg</text>
  </g>
  <text x="1016" y="240" fill="#a9a9b2" font-size="13" font-weight="600" text-anchor="middle">Export</text>
  <text x="1016" y="258" fill="#75757e" font-size="11.5" text-anchor="middle">formats tools read</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f9f78"/>
    </marker>
  </defs>
</svg>
